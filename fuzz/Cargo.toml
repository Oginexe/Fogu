[package]
name = "fogu-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fogu-term = { path = "../crates/term" }
fogu-core = { path = "../crates/core" }
serde_json = "1.0.154"
# No `ssh` feature: `validate_name`/`display_name` are pure and live in the always-built
# `sftp` module, so the fuzz build stays free of russh/ring.
fogu-session = { path = "../crates/session", default-features = false }

[[bin]]
name = "osc_payloads"
path = "fuzz_targets/osc_payloads.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sftp_name_sanitize"
path = "fuzz_targets/sftp_name_sanitize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vt_feed"
path = "fuzz_targets/vt_feed.rs"
test = false
doc = false
bench = false

# Deliberately not a member of the parent workspace:
# cargo-fuzz needs nightly + ASan instrumentation that the rest of the crates must never pick up.
[workspace]

[[bin]]
name = "login_script_window"
path = "fuzz_targets/login_script_window.rs"
test = false
doc = false
bench = false

[[bin]]
name = "history_load"
path = "fuzz_targets/history_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proxy_command_expand"
path = "fuzz_targets/proxy_command_expand.rs"
test = false
doc = false
bench = false
