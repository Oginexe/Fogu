# Supply-chain gate.
# Run: `cargo deny check` from the workspace root.

[advisories]
version = 2
yanked = "deny"
ignore = [
    # unmaintained, no safe upgrade, pulled transitively through iced's wgpu backend
    # (metal -> wgpu-hal -> wgpu -> iced_wgpu); revisit when iced bumps wgpu.
    "RUSTSEC-2024-0436", # paste, via wgpu-hal(metal)
    # unmaintained, no safe upgrade, pulled transitively through iced's cosmic-text/sctk-adwaita
    # font stack (fontdb/ab_glyph); revisit when iced bumps cosmic-text.
    "RUSTSEC-2026-0192", # ttf-parser, via cosmic-text/ab_glyph
    # unmaintained (merged into zbus 6), no vulnerability; zbus 5 is pulled by iced_winit (mundy),
    # rfd (ashpd) and oo7, none on zbus 6 yet; revisit when they move to zbus 6.
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0", # option-ext (via dirs)
    "BSL-1.0", # clipboard-win, error-code (via iced_winit -> window_clipboard)
    "CC0-1.0", # hexf-parse (via iced's wgpu backend: naga)
]

[bans]
multiple-versions = "warn"
deny = [
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "libssh2-sys" },
    { crate = "aws-lc-rs" },   # why: russh uses ring, not aws-lc
    { crate = "aws-lc-sys" },
    { crate = "wgpu", deny-multiple-versions = true },        # why: use iced's re-export only
    { crate = "cosmic-text", deny-multiple-versions = true }, # why: use iced's re-export only
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
