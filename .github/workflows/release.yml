name: release
# Push a tag matching the workspace version (`v0.1.0` for version = "0.1.0") to publish a
# GitHub Release with one archive per platform.
on:
  push:
    tags: ["v*"]
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    strategy:
      matrix:
        include:
          # 22.04, not 24.04: the binary needs the build host's glibc (2.35) or newer
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: macos-15
            name: macos-aarch64
          - os: macos-15-intel
            name: macos-x86_64
          # static CRT: the .exe runs without the Visual C++ redistributable
          - os: windows-2025
            name: windows-x86_64
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: tag matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "${GITHUB_REF_NAME}" = "v$version" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-dev libwayland-dev
      - run: cargo build --release --locked -p fogu
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      # size gate: lower the limit whenever a cut lands (scripts/metrics.sh measures it)
      - if: runner.os == 'Linux'
        run: test "$(stat -c %s target/release/fogu)" -le 21000000
      # the licence texts of every crate in the binary (MIT/Apache/BSD require shipping them)
      - name: third-party crate licences
        run: |
          cargo install --locked --features cli cargo-about@0.9.2
          cargo about generate --locked -m crates/app/Cargo.toml about.hbs -o THIRD_PARTY_CRATES
      # the layout scripts/install.sh expects, so the archive installs with the same script
      - name: package
        if: runner.os != 'Windows'
        run: |
          d="Fogu-${{ matrix.name }}"
          mkdir -p "$d/target/release" "$d/scripts" "$d/assets/icons" "$d/assets/fonts"
          cp target/release/fogu "$d/target/release/"
          cp scripts/install.sh "$d/scripts/"
          cp assets/fogu.png assets/fogu.desktop "$d/assets/"
          cp assets/icons/fogu-*.png "$d/assets/icons/"
          cp LICENSE README.md THIRD_PARTY_LICENSES THIRD_PARTY_CRATES "$d/"
          cp assets/fonts/*-LICENSE.txt "$d/assets/fonts/"
          tar czf "$d.tar.gz" "$d"
      - name: package (Windows)
        if: runner.os == 'Windows'
        run: |
          d="Fogu-${{ matrix.name }}"
          mkdir -p "$d/assets/fonts"
          cp target/release/fogu.exe LICENSE README.md THIRD_PARTY_LICENSES THIRD_PARTY_CRATES "$d/"
          cp assets/fonts/*-LICENSE.txt "$d/assets/fonts/"
          7z a "$d.zip" "$d"
      # the binary links only libc/libm/libgcc_s, so the AppDir needs nothing but the binary
      - name: appimage
        if: runner.os == 'Linux'
        run: |
          mkdir -p Fogu.AppDir/usr/bin Fogu.AppDir/usr/share/doc/fogu
          cp target/release/fogu Fogu.AppDir/usr/bin/
          cp LICENSE THIRD_PARTY_LICENSES THIRD_PARTY_CRATES assets/fonts/*-LICENSE.txt \
            Fogu.AppDir/usr/share/doc/fogu/
          cp assets/fogu.desktop Fogu.AppDir/
          cp assets/icons/fogu-256.png Fogu.AppDir/fogu.png
          ln -s usr/bin/fogu Fogu.AppDir/AppRun
          curl -fsSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          # no FUSE on the runner: the tool unpacks itself instead of mounting
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool Fogu.AppDir Fogu-x86_64.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: Fogu-${{ matrix.name }}
          path: |
            Fogu-${{ matrix.name }}.tar.gz
            Fogu-${{ matrix.name }}.zip
            Fogu-x86_64.AppImage
          if-no-files-found: ignore
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # artifact attestations: anyone can check a download with `gh attestation verify`
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: sha256sum Fogu-*.tar.gz Fogu-*.zip Fogu-*.AppImage > SHA256SUMS
      - uses: actions/attest@v4
        with:
          subject-path: "Fogu-*.tar.gz, Fogu-*.zip, Fogu-*.AppImage"
      - run: gh release create "$GITHUB_REF_NAME" Fogu-*.tar.gz Fogu-*.zip Fogu-*.AppImage SHA256SUMS --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
