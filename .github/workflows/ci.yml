name: ci
on:
  # branches are checked by their pull_request run; only main also runs on push
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", "THIRD_PARTY_LICENSES"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", "THIRD_PARTY_LICENSES"]
  schedule:
    - cron: "17 3 * * *" # nightly: fuzz-smoke
# a newer push to the same pull request cancels the run it replaces
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # full debuginfo made the test build outgrow the runner's disk (93 MB left, linker bus
  # error); line tables keep file:line backtraces at about half the size (4.6 GB vs ~9.4 GB)
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # no toolchain action: rustup (preinstalled on ubuntu-24.04) auto-installs the
      # toolchain + components from rust-toolchain.toml, which is also the MSRV
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-dev libwayland-dev socat openssh-server
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # a `fogu-term` API change must break the fuzz targets at PR time, not at the nightly run
      - run: cargo check --manifest-path fuzz/Cargo.toml --locked
      - name: every crate opts into workspace lints
        run: |
          for f in crates/*/Cargo.toml; do
            grep -q 'workspace = true' "$f" || exit 1
          done
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      # the SSH integration tests need a real sshd (installed above): a missing one fails the run
      - run: cargo nextest run --workspace --locked --no-tests=pass
        env:
          FOGU_REQUIRE_SSHD: "1"
      - run: cargo test --doc --workspace --locked
      - run: cargo deny check
  # the macOS build: an ungated Linux-only call breaks here, not on a user's Mac
  check-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # FOGU_REQUIRE_SSHD unset: the SSH tests run where the runner's sshd starts, else skip
      - run: cargo nextest run --workspace --locked --no-tests=pass
      - run: cargo test --doc --workspace --locked
  # the Windows build (alpha): ConPTY, Credential Manager, the agent pipe and the SFTP path checks
  check-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # no sshd on the runner: the SSH integration tests skip themselves
      - run: cargo nextest run --workspace --locked --no-tests=pass
      - run: cargo test --doc --workspace --locked
  fuzz-smoke:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: detect fuzz targets
        id: has-fuzz
        run: echo "present=$([ -d fuzz ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.has-fuzz.outputs.present == 'true'
        run: cargo install cargo-fuzz --locked
      - if: steps.has-fuzz.outputs.present == 'true'
        run: for t in $(cargo +nightly fuzz list); do cargo +nightly fuzz run "$t" -- -max_total_time=60; done
